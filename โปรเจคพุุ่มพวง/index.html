<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รถพุ่มพวง - ตลาดเคลื่อนที่ออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- แถบ Navbar ด้านบนสุดแบบในรูป -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="brand" onclick="navigateTo('home')">
                🚚 รถพุ่มพวง
            </a>
            <div id="navbarMenu" class="nav-menu">
                <!-- เมนูจะเรนเดอร์ผ่าน renderNavbar() -->
            </div>
        </div>
    </nav>

    <!-- พื้นที่แสดงเนื้อหาหลัก -->
    <main class="container">
        <div id="content">
            <div style="text-align: center; padding: 50px; color: #64748b;">
                <p>⌛ กำลังเชื่อมต่อฐานข้อมูล...</p>
            </div>
        </div>
    </main>

    <!-- Modal Popup -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- ไฟล์ JS หลัก -->
    <script src="script.js"></script>
</body>
</html>
